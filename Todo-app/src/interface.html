<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<!--TODO: Inlcuir estilização CSS na página-->
<body>
<!--Menu Interativo-->
<h1>ToDo List</h1>

<input id="novaTarefa">

<select id="menuOpcoes">
    <option value="1">1 - Cadastrar Tarefa</option>
    <option value="2">2 - Listar Tarefas</option>
    <option value="3">3 - Remover Tarefa</option>
    <option value="4">4 - Sair</option>
</select>

<button id="botaoTodoList">Enter</button>

<p id="mensagemFeedback">Escolha uma das opções acima</p>

<!--TODO: Aprender como o programa pode incrementar a tabela dinâmicamente a medida que novas tarefas são adicionadas.-->
<table id="tabelaTarefas" hidden>
    <thead>
        <tr>
            <th scope="col">Status</th>
            <th scope="col">Tarefa</th>
            <th scope="col">Ação</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <th scope="row"></th>
            <td></td>
            <td></td>
        </tr>
    </tbody>
</table>

<script src="todo.js"></script>
</body>
</html>
